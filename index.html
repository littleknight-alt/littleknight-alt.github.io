<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://www.googleapis.com https://accounts.google.com/gsi/ https://oauth2.googleapis.com; frame-src https://accounts.google.com/gsi/; worker-src 'self' blob:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>シンプルPDFノート</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<main id="library" aria-labelledby="libTitle">
  <div class="lib-head">
    <div class="lib-title">
      <button class="btn ghost lib-back" id="libBack" type="button" hidden></button>
      <h1 id="libTitle">ノート</h1>
      <div class="count" id="libCount">&nbsp;</div>
      <button class="sync-chip" id="libSync" type="button"></button>
    </div>
    <div class="lib-actions">
      <button class="btn primary" id="openPdfBtn" type="button"></button>
      <button class="btn" id="newBlankBtn" type="button"></button>
      <button class="btn" id="newFolderBtn" type="button"></button>
      <button class="btn" id="backupBtn" type="button"></button>
    </div>
  </div>
  <label class="search" id="libSearch">
    <span id="libSearchIcon"></span>
    <input type="search" id="libQuery" placeholder="タイトルやPDFの文字で検索" enterkeyhint="search" autocomplete="off" aria-label="ノートを検索">
  </label>
  <div class="safety" id="safety">
    <strong id="safetyLead"></strong>
    <span id="safetyText"></span>
    <button class="btn ghost" id="safetyBtn" type="button">くわしく</button>
  </div>
  <div id="libBanner" hidden></div>
  <div id="results" hidden aria-live="polite"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden></div>
</main>

<section id="editor" hidden aria-label="ノートの編集">
  <header class="ebar">
    <div class="ebar-row">
      <button class="btn ghost" id="backBtn" type="button"></button>
      <button class="ed-title" id="edTitle" type="button" aria-label="ノートの名前を変更"></button>
      <button class="sync-chip" id="edSync" type="button" hidden></button>
      <span class="save-state" id="saveState" data-s="ok" role="status">保存済み</span>
    </div>
    <div class="tools" role="toolbar" aria-label="ペンの設定">
      <button class="ib" id="tPen" type="button" aria-label="ペン"></button>
      <button class="ib" id="tHl" type="button" aria-label="蛍光ペン"></button>
      <button class="ib" id="tEr" type="button" aria-label="消しゴム"></button>
      <span class="sep"></span>
      <div id="swatches" class="tgroup"></div>
      <span class="sep"></span>
      <div id="widths" class="tgroup tight"></div>
      <span class="sep"></span>
      <button class="ib" id="undoBtn" type="button" aria-label="取り消す"></button>
      <button class="ib" id="redoBtn" type="button" aria-label="やり直す"></button>
      <span class="sep"></span>
      <button class="ib" id="zOut" type="button" aria-label="縮小"></button>
      <button class="zoom-lbl" id="zLbl" type="button" aria-label="倍率を100%に戻す">100%</button>
      <button class="ib" id="zIn" type="button" aria-label="拡大"></button>
      <span class="sep"></span>
      <button class="txt-tool" id="searchBtn" type="button"></button>
      <button class="txt-tool" id="pagesBtn" type="button"></button>
      <button class="txt-tool" id="addPageBtn" type="button"></button>
      <button class="txt-tool" id="exportBtn" type="button"></button>
      <button class="txt-tool" id="fingerBtn" type="button" aria-pressed="false"></button>
    </div>
  </header>
  <div id="scroller"><div id="pages"></div></div>
  <div class="page-num" id="pageNum">1 / 1</div>
</section>

<div class="dr-back" id="drBack" hidden></div>
<aside id="drawer" hidden aria-label="ページ一覧">
  <div class="dr-head">
    <h2 id="drTitle">ページ</h2>
    <button class="ib sm" id="drClose" type="button" aria-label="ページ一覧を閉じる"></button>
  </div>
  <div class="dr-search" id="drSearchRow" hidden>
    <label class="search"><span id="drSearchIcon"></span><input type="search" id="drQuery" placeholder="このノートを検索" enterkeyhint="search" autocomplete="off" aria-label="このノートを検索"></label>
  </div>
  <div class="dr-list" id="drList"></div>
  <div class="dr-foot" id="drFoot"><button class="btn" id="drAdd" type="button"></button></div>
</aside>

<div id="toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="pdfInput" accept="application/pdf,.pdf" hidden>
<input type="file" id="backupInput" accept="application/json,.json" hidden>
<script type="module" src="app.js"></script>
</body>
</html>
